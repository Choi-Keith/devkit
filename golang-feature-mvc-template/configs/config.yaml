server:
  host: 0.0.0.0
  port: 8082
  readTimeout: 30s
  writeTimeout: 30m
  shutdownTimeout: 30s
  production: false

log:
  level: info        # debug, info, warn, error
  format: console    # json, console
  outputPath: stdout # stdout, stderr, or file path
  maxSize: 100
  maxBackups: 3
  maxAge: 7
  compress: false

database:
  driver: mysql # postgres, mysql
  host: localhost
  port: 3308
  username: root
  password: root
  dbname: app
  sslMode: disable
  maxOpenConns: 25
  maxIdleConns: 10
  connMaxLifetime: 30 # minutes
  connMaxIdleTime: 10 # minutes
  logLevel: warn
  slowThreshold: 200 # ms

redis:
  host: localhost
  port: 6380
  password: ""
  db: 0
  poolSize: 10
  minIdleConns: 5
  dialTimeout: 5s
  readTimeout: 3s
  writeTimeout: 3s

jwt:
  secret: dev-only-secret-change-me # 生产环境必须通过环境变量 JWT_SECRET 覆盖
  issuer: golang-feature-mvc-template
  accessExpiration: 2h     # access token 有效期
  refreshExpiration: 168h  # refresh token 有效期(7 天)
