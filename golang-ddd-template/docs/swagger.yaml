basePath: /api/v1
definitions:
  order.CreateOrderRequest:
    properties:
      amount:
        description: 金额,单位:分
        example: 199900
        minimum: 1
        type: integer
      userId:
        description: 下单用户 ID
        example: 1
        minimum: 1
        type: integer
    required:
    - amount
    - userId
    type: object
  order.ErrorEnvelope:
    properties:
      code:
        example: 20100
        type: integer
      message:
        example: 订单不存在
        type: string
    type: object
  order.OrderEnvelope:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/order.OrderResponse'
      message:
        example: success
        type: string
    type: object
  order.OrderListData:
    properties:
      list:
        items:
          $ref: '#/definitions/order.OrderResponse'
        type: array
      page:
        example: 1
        type: integer
      pageSize:
        example: 20
        type: integer
      total:
        example: 100
        type: integer
    type: object
  order.OrderListEnvelope:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/order.OrderListData'
      message:
        example: success
        type: string
    type: object
  order.OrderResponse:
    properties:
      amount:
        example: 199900
        type: integer
      createdAt:
        example: "2026-08-27T08:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      orderNo:
        example: O17562624000000000000123
        type: string
      status:
        example: pending
        type: string
      userId:
        example: 1
        type: integer
    type: object
  user.ErrorEnvelope:
    properties:
      code:
        example: 20000
        type: integer
      message:
        example: 用户不存在
        type: string
    type: object
  user.RegisterUserRequest:
    properties:
      email:
        description: 邮箱
        example: user@example.com
        type: string
      name:
        description: 昵称
        example: Alice
        type: string
      password:
        description: 密码(至少 8 位)
        example: P@ssw0rd123
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  user.UserEnvelope:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/user.UserResponse'
      message:
        example: success
        type: string
    type: object
  user.UserListData:
    properties:
      list:
        items:
          $ref: '#/definitions/user.UserResponse'
        type: array
      page:
        example: 1
        type: integer
      pageSize:
        example: 20
        type: integer
      total:
        example: 100
        type: integer
    type: object
  user.UserListEnvelope:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/user.UserListData'
      message:
        example: success
        type: string
    type: object
  user.UserResponse:
    properties:
      createdAt:
        example: "2026-08-27T08:00:00Z"
        type: string
      email:
        example: user@example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Alice
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 基于 golang-common 的 DDD 脚手架服务
  title: golang-ddd-template API
  version: "1.0"
paths:
  /orders:
    get:
      parameters:
      - description: 页码,从 1 开始
        example: 1
        in: query
        name: page
        type: integer
      - description: 每页数量,最大 100
        example: 20
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/order.OrderListEnvelope'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/order.ErrorEnvelope'
      summary: 分页查询订单
      tags:
      - order
    post:
      consumes:
      - application/json
      description: 为指定用户创建一个待支付订单,订单号由服务端生成
      parameters:
      - description: 创建订单请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/order.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            $ref: '#/definitions/order.OrderEnvelope'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/order.ErrorEnvelope'
      summary: 创建订单
      tags:
      - order
  /orders/{id}:
    get:
      parameters:
      - description: 订单 ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/order.OrderEnvelope'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/order.ErrorEnvelope'
        "404":
          description: 订单不存在
          schema:
            $ref: '#/definitions/order.ErrorEnvelope'
      summary: 查询订单详情
      tags:
      - order
  /orders/{id}/cancel:
    post:
      description: 仅待支付订单可以取消
      parameters:
      - description: 订单 ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 取消成功
          schema:
            $ref: '#/definitions/order.OrderEnvelope'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/order.ErrorEnvelope'
        "404":
          description: 订单不存在
          schema:
            $ref: '#/definitions/order.ErrorEnvelope'
        "409":
          description: 订单状态不允许取消
          schema:
            $ref: '#/definitions/order.ErrorEnvelope'
      summary: 取消订单
      tags:
      - order
  /users:
    get:
      parameters:
      - description: 页码,从 1 开始
        example: 1
        in: query
        name: page
        type: integer
      - description: 每页数量,最大 100
        example: 20
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/user.UserListEnvelope'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/user.ErrorEnvelope'
      summary: 分页查询用户
      tags:
      - user
    post:
      consumes:
      - application/json
      description: 创建一个新用户账号
      parameters:
      - description: 注册请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.RegisterUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            $ref: '#/definitions/user.UserEnvelope'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/user.ErrorEnvelope'
        "409":
          description: 邮箱已被注册
          schema:
            $ref: '#/definitions/user.ErrorEnvelope'
      summary: 注册用户
      tags:
      - user
  /users/{id}:
    delete:
      parameters:
      - description: 用户 ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: 删除成功
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/user.ErrorEnvelope'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/user.ErrorEnvelope'
      summary: 删除用户
      tags:
      - user
    get:
      parameters:
      - description: 用户 ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/user.UserEnvelope'
        "400":
          description: 参数无效
          schema:
            $ref: '#/definitions/user.ErrorEnvelope'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/user.ErrorEnvelope'
      summary: 查询用户详情
      tags:
      - user
swagger: "2.0"
